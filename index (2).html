<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moto Click</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    main {
      width: min(92%, 760px);
      padding: 48px;
      text-align: center;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(0,0,0,.35);
    }
    h1 { font-size: clamp(40px, 7vw, 72px); margin: 0 0 16px; }
    p { color: #cbd5e1; font-size: 18px; line-height: 1.6; }
    .ok { margin-top: 24px; color: #86efac; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Moto Click</h1>
    <p>O site está configurado e pronto para receber o conteúdo definitivo.</p>
    <div class="ok">Site publicado com GitHub Pages 🚀</div>
  </main>
</body>
</html>
